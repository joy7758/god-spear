name: spear-check
on: [push, pull_request]
jobs:
  spear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i -g .
      - run: spear check .spear-rules.json --out spear/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: god-spear-report
          path: spear/reports
